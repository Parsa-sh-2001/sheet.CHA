<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Add Sheet | Piano Sheets</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } :root { --background: #f7f9f7; --surface: #ffffff; --green: #2f7d5a; --green-dark: #246346; --green-light: #e8f3ed; --text: #17201b; --muted: #6f7a73; --border: #dfe7e2; --error: #b94a48; } /* ========================= Body ========================= */ body { font-family: Arial, sans-serif; background: var(--background); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; } /* ========================= Header ========================= */ header { height: 72px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; } .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; } .logo-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--green-light); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 17px; } .academy { color: var(--muted); font-size: 14px; } /* ========================= Main ========================= */ main { width: 90%; max-width: 700px; margin: 50px auto; flex: 1; } /* ========================= Back ========================= */ .back-button { display: inline-block; margin-bottom: 25px; color: var(--green-dark); text-decoration: none; font-size: 14px; font-weight: 600; } .back-button:hover { text-decoration: underline; } /* ========================= Page Header ========================= */ .page-header { margin-bottom: 30px; } .page-header h1 { font-size: 32px; letter-spacing: -0.6px; margin-bottom: 8px; } .page-header p { color: var(--muted); font-size: 15px; } /* ========================= Form Card ========================= */ .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; } /* ========================= Form Groups ========================= */ .form-group { margin-bottom: 22px; } .form-group:last-of-type { margin-bottom: 0; } label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; } .hint { color: var(--muted); font-size: 12px; margin-top: 6px; } input[type="text"] { width: 100%; padding: 13px 14px; background: #ffffff; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; transition: 0.2s; } input[type="text"]:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); } /* ========================= File Input ========================= */ .file-input { width: 100%; padding: 14px; background: var(--green-light); border: 1px dashed #b8d2c3; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 14px; } .file-input:hover { border-color: var(--green); } /* ========================= Path Preview ========================= */ .path-preview { margin-top: 10px; padding: 11px 13px; background: #f4f7f5; border: 1px solid var(--border); border-radius: 7px; color: var(--muted); font-family: monospace; font-size: 13px; } .path-preview span { color: var(--green-dark); } /* ========================= Submit ========================= */ .submit-button { width: 100%; margin-top: 28px; padding: 13px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; } .submit-button:hover { background: var(--green-dark); transform: translateY(-1px); } /* ========================= Footer ========================= */ footer { border-top: 1px solid var(--border); background: var(--surface); padding: 22px; text-align: center; color: var(--muted); font-size: 13px; } /* ========================= Mobile ========================= */ @media (max-width: 600px) { header { padding: 0 20px; } .academy { display: none; } main { width: calc(100% - 32px); margin: 30px auto; } .form-card { padding: 20px; } .page-header h1 { font-size: 28px; } } </style> </head> <body> <!-- ========================= Header ========================= --> <header> <div class="logo"> <div class="logo-icon"> ♫ </div> <span> Piano Sheets </span> </div> <div class="academy"> Naser Cheshmazar Academy </div> </header> <!-- ========================= Main ========================= --> <main> <a href="/" class="back-button"> ← Back to Sheets </a> <div class="page-header"> <h1> Add Sheet </h1> <p> Add a new piano sheet to the library. </p> </div> <form class="form-card" action="/api/sheets" method="POST" enctype="multipart/form-data" > <!-- PDF --> <div class="form-group"> <label for="pdf"> PDF File </label> <input id="pdf" name="pdf" class="file-input" type="file" accept=".pdf,application/pdf" required > </div> <!-- Name --> <div class="form-group"> <label for="name"> Sheet Name </label> <input id="name" name="name" type="text" placeholder="e.g. Interstellar" required > </div> <!-- Author --> <div class="form-group"> <label for="author"> Author </label> <input id="author" name="author" type="text" placeholder="e.g. Hans Zimmer" required > </div> <!-- Path --> <div class="form-group"> <label for="path"> Sheet Path </label> <input id="path" name="path" type="text" placeholder="/hans_zimmer/interstellar" > <p class="hint"> This will be the URL used to access the sheet. </p> <div class="path-preview"> piano-sheets.local<span>/hans_zimmer/interstellar</span> </div> </div> <!-- Submit --> <button type="submit" class="submit-button"> Add Sheet </button> </form> </main> <!-- ========================= Footer ========================= --> <footer> Made by Parsa Shirin for Naser Cheshmazar Academy — All Rights Reserved ™ </footer> </body> </html>
