```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experience | Piano Sheets</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f7f9f7;
            --surface: #ffffff;

            --green: #2f7d5a;
            --green-dark: #246346;
            --green-light: #e8f3ed;

            --text: #17201b;
            --muted: #6f7a73;

            --border: #dfe7e2;
        }


        /* =========================
           Body
        ========================= */

        body {
            font-family: Arial, sans-serif;

            background: var(--background);
            color: var(--text);

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           Header
        ========================= */

        header {
            height: 72px;

            background: var(--surface);

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }


        .logo {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 20px;
            font-weight: 700;
        }


        .logo-icon {
            width: 34px;
            height: 34px;

            border-radius: 9px;

            background: var(--green-light);
            color: var(--green);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
        }


        .academy {
            color: var(--muted);

            font-size: 14px;
        }


        /* =========================
           Main
        ========================= */

        main {
            width: 90%;
            max-width: 1100px;

            margin: 40px auto;

            flex: 1;
        }


        /* =========================
           Back Button
        ========================= */

        .back-button {
            display: inline-flex;
            align-items: center;

            gap: 7px;

            margin-bottom: 25px;

            color: var(--green-dark);

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }


        .back-button:hover {
            text-decoration: underline;
        }


        /* =========================
           Sheet Header
        ========================= */

        .sheet-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }


        .sheet-info h1 {
            font-size: 32px;

            letter-spacing: -0.6px;

            margin-bottom: 7px;
        }


        .sheet-info p {
            color: var(--muted);

            font-size: 14px;
        }


        /* =========================
           Download Button
        ========================= */

        .download-button {
            border: none;

            background: var(--green);
            color: white;

            padding: 11px 17px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            text-decoration: none;

            white-space: nowrap;

            transition: 0.2s;
        }


        .download-button:hover {
            background: var(--green-dark);

            transform: translateY(-1px);
        }


        /* =========================
           PDF Viewer
        ========================= */

        .pdf-container {
            width: 100%;

            height: 750px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(35, 70, 50, 0.05);
        }


        .pdf-container iframe {
            width: 100%;
            height: 100%;

            border: none;
        }


        /* =========================
           Footer
        ========================= */

        footer {
            border-top: 1px solid var(--border);

            background: var(--surface);

            padding: 22px;

            text-align: center;

            color: var(--muted);

            font-size: 13px;
        }


        /* =========================
           Mobile
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }


            .academy {
                display: none;
            }


            main {
                width: calc(100% - 32px);

                margin: 30px auto;
            }


            .sheet-header {
                align-items: flex-start;

                flex-direction: column;
            }


            .sheet-info h1 {
                font-size: 28px;
            }


            .download-button {
                width: 100%;

                text-align: center;
            }


            .pdf-container {
                height: 600px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         Header
    ========================= -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                ♫
            </div>

            <span>
                Piano Sheets
            </span>

        </div>


        <div class="academy">
            Naser Cheshmazar Academy
        </div>

    </header>



    <!-- =========================
         Main
    ========================= -->

    <main>


        <!-- Back -->

        <a href="index.html" class="back-button">
            ← Back to Sheets
        </a>



        <!-- Sheet Information -->

        <div class="sheet-header">

            <div class="sheet-info">

                <h1>
                    {{.Name}}
                </h1>

                <p>
                    {{.Author}}
                </p>

            </div>


            <a
                href="/pdf/{{.Pdf}}"
                download
                class="download-button"
            >
                Download PDF
            </a>

        </div>



        <!-- PDF Viewer -->

        <div class="pdf-container">

            <iframe
                src="/pdf/{{.Pdf}}"
                title="{{.Name}} PDF"
            ></iframe>

        </div>


    </main>



    <!-- =========================
         Footer
    ========================= -->

    <footer>

        Made by Parsa Shirin for Naser Cheshmazar Academy —
        All Rights Reserved ™

    </footer>


</body>

</html>
```
